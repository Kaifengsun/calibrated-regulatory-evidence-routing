[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrated-regulatory-evidence-routing"
version = "0.1.0"
description = "Pilot-first calibrated evidence routing for regulatory retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.23,<7",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.8,<3",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "statsmodels>=0.14,<1",
    "typer>=0.12,<1",
    "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
]

[project.scripts]
evidence-routing = "evidence_routing.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
